<!-- Override greedy-nav: MutationObserver keeps all links visible -->
<script>
(function() {
  function fixNav() {
    var hidden = document.querySelector('#site-nav .hidden-links');
    var visible = document.querySelector('#site-nav .visible-links');
    var btn = document.querySelector('#site-nav button');
    if (hidden && visible) {
      while (hidden.firstChild) {
        visible.appendChild(hidden.firstChild);
      }
      hidden.classList.add('hidden');
    }
    if (btn) btn.style.display = 'none';
  }

  // Watch for greedy-nav moving items and immediately reverse it
  function startObserver() {
    var hidden = document.querySelector('#site-nav .hidden-links');
    if (!hidden) return;
    var observer = new MutationObserver(function() {
      if (hidden.children.length > 0) fixNav();
    });
    observer.observe(hidden, { childList: true });
    // Also observe the button becoming visible
    var btn = document.querySelector('#site-nav button');
    if (btn) {
      var btnObs = new MutationObserver(function() {
        btn.style.display = 'none';
      });
      btnObs.observe(btn, { attributes: true, attributeFilter: ['class'] });
    }
  }

  // Run fix repeatedly during load to catch greedy-nav whenever it executes
  var attempts = 0;
  var interval = setInterval(function() {
    fixNav();
    attempts++;
    if (attempts > 20) clearInterval(interval);
  }, 100);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      fixNav();
      startObserver();
    });
  } else {
    fixNav();
    startObserver();
  }

  window.addEventListener('resize', function() { fixNav(); });
})();
</script>
